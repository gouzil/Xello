name: CI Compile

on:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - c
          - cpp
          - go
          - rust
          - zig
          - kotlin_native
          - wasm
          - moonbit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'
      - name: Install native dependencies
        if: contains(fromJSON('["python","c","cpp","zig","kotlin_native","wasm","moonbit"]'), matrix.language)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates g++
      - name: Install pybind11
        if: matrix.language == 'cpp'
        run: python -m pip install pybind11
      - uses: mlugg/setup-zig@v2
        if: matrix.language == 'zig'
        with:
          version: 0.16.0
      - uses: actions/setup-java@v5
        if: matrix.language == 'kotlin_native'
        with:
          distribution: temurin
          java-version: "17"
      - uses: robinraju/release-downloader@v1
        if: matrix.language == 'kotlin_native'
        with:
          repository: JetBrains/kotlin
          tag: v1.9.24
          fileName: kotlin-native-linux-x86_64-1.9.24.tar.gz
          out-file-path: .toolchains/kotlin-native
          extract: true
      - name: Add Kotlin/Native to PATH
        if: matrix.language == 'kotlin_native'
        run: |
          echo "$GITHUB_WORKSPACE/.toolchains/kotlin-native/kotlin-native-linux-x86_64-1.9.24/bin" >> "$GITHUB_PATH"
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        if: matrix.language == 'wasm'
        with:
          version: "1.246.2"
      - name: Install MoonBit
        if: matrix.language == 'moonbit'
        run: |
          curl --retry 3 -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: python tools/build.py --languages "${{ matrix.language }}"
      - name: Smoke-test the MoonBit runner
        if: matrix.language == 'moonbit'
        run: python tools/run_from.py moonbit --json call moonbit
