name: CI Docker Matrix

on:
  pull_request:

jobs:
  docker-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        moonbit_backend: [c, native, js, wasm, wasm-gc]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg MOONBIT_BACKEND=${{ matrix.moonbit_backend }} -t xello .
      - run: docker run --rm xello make test
