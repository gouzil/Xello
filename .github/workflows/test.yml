name: CI Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        moonbit_backend: [c, native, js, wasm, wasm-gc]
    env:
      MOONBIT_BACKEND: ${{ matrix.moonbit_backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends g++
      - run: python -m pip install pybind11
      - name: Install MoonBit
        run: |
          curl --retry 3 -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        if: contains(fromJSON('["js","wasm","wasm-gc"]'), matrix.moonbit_backend)
        with:
          node-version: "24"
      - name: Install embedded V8
        if: contains(fromJSON('["js","wasm","wasm-gc"]'), matrix.moonbit_backend)
        run: python -m pip install -r requirements-moonbit.txt
      - run: make test
